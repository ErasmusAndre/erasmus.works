apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: homelab
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        annotations:
          # Pin the gateway IP; Blocky and AdGuard point `*.homelab` at it.
          metallb.io/loadBalancerIPs: 192.168.20.241

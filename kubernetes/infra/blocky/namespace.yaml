apiVersion: v1
kind: Namespace
metadata:
  name: blocky
  labels:
    # Talos enforces the baseline Pod Security Standard cluster-wide, which
    # disallows hostPort. The pods themselves stay non-root, read-only and
    # capability-free.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

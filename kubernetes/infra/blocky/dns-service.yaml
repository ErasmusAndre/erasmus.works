apiVersion: v1
kind: Service
metadata:
  name: blocky-dns
  namespace: blocky
  labels:
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/name: blocky
  annotations:
    metallb.io/loadBalancerIPs: 192.168.20.242
spec:
  type: LoadBalancer
  # Keep the real client IP for Blocky query logs; the DaemonSet has a pod on every node.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/name: blocky
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP

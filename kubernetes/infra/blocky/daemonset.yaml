apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: blocky
  namespace: blocky
  labels:
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/name: blocky
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: blocky
      app.kubernetes.io/name: blocky
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: blocky
        app.kubernetes.io/name: blocky
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      # The control plane is schedulable (allowSchedulingOnControlPlanes), but keep the
      # toleration so every node keeps a resolver even if that ever changes.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blocky
          image: ghcr.io/0xerr0r/blocky:v0.35.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
          ports:
            - name: dns-udp
              containerPort: 1053
              protocol: UDP
            - name: dns-tcp
              containerPort: 1053
              protocol: TCP
            - name: http
              containerPort: 4000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          livenessProbe:
            exec:
              command:
                - /app/blocky
                - healthcheck
                - --port
                - "1053"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /app/blocky
                - healthcheck
                - --port
                - "1053"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # Sized for the ~340k denylist rules held in memory.
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/config.yml
              subPath: config.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: blocky-config

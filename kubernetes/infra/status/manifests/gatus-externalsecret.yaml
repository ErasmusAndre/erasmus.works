apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-ntfy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gatus-ntfy
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        NTFY_TOKEN: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: ntfy-token-gatus
        metadataPolicy: None
        nullBytePolicy: Ignore

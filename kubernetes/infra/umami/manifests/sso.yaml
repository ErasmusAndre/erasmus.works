apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami-sso
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umami-sso
  template:
    metadata:
      labels:
        app: umami-sso
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The bridge only needs the Postgres driver. Keep the pg version in step
        # with the one bundled in the Umami image when bumping it by hand.
        - name: install-deps
          image: node:24.21.0-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - npm
            - install
            - --prefix=/deps
            - --no-audit
            - --no-fund
            - pg@8.23.0
          env:
            - name: npm_config_cache
              value: /tmp/npm-cache
          volumeMounts:
            - name: deps
              mountPath: /deps
            - name: tmp
              mountPath: /tmp
      containers:
        - name: umami-sso
          image: node:24.21.0-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - node
            - /app/server.mjs
          env:
            - name: PUBLIC_URL
              value: https://umami.erasmus.works
            - name: OIDC_ISSUER
              value: https://authentik.erasmus.works/application/o/umami/
            - name: OIDC_CLIENT_ID
              value: umami-erasmus-works
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: umami-oidc
                  key: client-secret
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: umami-app-secrets
                  key: app-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: umami-app-secrets
                  key: database-url
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: deps
              mountPath: /deps
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: umami-sso-script
        - name: deps
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: umami-sso
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: umami-sso
  ports:
    - name: http
      port: 3001
      targetPort: http

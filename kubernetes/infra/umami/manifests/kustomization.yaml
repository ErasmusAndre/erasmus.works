apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: umami
resources:
  # Core
  - namespace.yaml
  - externalsecrets.yaml
  - postgres.yaml
  - app.yaml

  # Networking
  - httproute.yaml
  - backendtrafficpolicy.yaml

  # SSO
  - sso-externalsecret.yaml
  - sso.yaml

configMapGenerator:
  - name: umami-sso-script
    files:
      - sso/server.mjs

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umami
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: homelab
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - umami.homelab
    - umami.erasmus.works
  rules:
    # Password login stays reachable at /login?local=1 in case Authentik is down.
    # It wins over the bridge rule below because it has an extra query match.
    - matches:
        - path:
            type: Exact
            value: /login
          queryParams:
            - type: Exact
              name: local
              value: "1"
      backendRefs:
        - name: umami
          group: ""
          kind: Service
          port: 3000
          weight: 1
    - matches:
        - path:
            type: Exact
            value: /login
        - path:
            type: Exact
            value: /oidc/callback
      backendRefs:
        - name: umami-sso
          group: ""
          kind: Service
          port: 3001
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: umami
          group: ""
          kind: Service
          port: 3000
          weight: 1

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-postgres-auth
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: umami-postgres-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/basic-auth
      data:
        username: umami
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: umami-postgres-password
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-app-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: umami-app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        # APP_SECRET is mixed into the visitor hash. Changing it resets every
        # session id, so existing visitors are counted as new ones.
        app-secret: "{{ .app_secret }}"
        database-url: postgresql://umami:{{ .password }}@umami-postgres-rw.umami.svc.cluster.local:5432/umami
  data:
    - secretKey: app_secret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: umami-app-secret
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: umami-postgres-password
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-postgres-backup-s3
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: umami-postgres-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        ACCESS_KEY_ID: "GK12444375daa667a53dfa7b5d"
        ACCESS_SECRET_KEY: "{{ .access_secret_key }}"
  data:
    - secretKey: access_secret_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: umami-cnpg-backup-secret-access-key
        metadataPolicy: None
        nullBytePolicy: Ignore

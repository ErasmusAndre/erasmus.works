apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umami
  template:
    metadata:
      labels:
        app: umami
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.38
          # busybox has no USER, so the pod-level runAsNonRoot would reject it
          # without an explicit uid.
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - until nc -z umami-postgres-rw.umami.svc.cluster.local 5432; do sleep 2; done
      containers:
        - name: umami
          image: ghcr.io/umami-software/umami:postgresql-v2.20.2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: umami-app-secrets
                  key: database-url
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: umami-app-secrets
                  key: app-secret
            - name: DISABLE_TELEMETRY
              value: "1"
          ports:
            - name: http
              containerPort: 3000
          # The first start runs database migrations, so give it room before the
          # liveness probe starts killing the pod.
          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: umami
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: umami
  ports:
    - name: http
      port: 3000
      targetPort: http

# Public S3 endpoint for apps whose browsers upload directly with presigned URLs.
# Only listed bucket paths are exposed; the CNPG backup buckets stay cluster-internal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-s3
  namespace: garage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: homelab
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - s3.erasmus.works
  rules:
    # Kudos photo and video proof (path-style: /kudos/<key>).
    - matches:
        - path:
            type: PathPrefix
            value: /kudos
      timeouts:
        # Envoy's default 15s route timeout would cut off slow mobile uploads.
        request: 0s
      backendRefs:
        - name: garage
          group: ""
          kind: Service
          port: 3900
          weight: 1

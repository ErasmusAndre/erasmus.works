apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    authentik.erasmus.works:53 {
        forward . 1.1.1.1 1.0.0.1
        cache 30
    }

    # Only *.homelab goes to Blocky (blocky-dns LoadBalancer). Everything else stays on the
    # host resolver, so a Blocky outage cannot take down cluster DNS.
    homelab:53 {
        errors
        forward . 192.168.20.242
        cache 30
    }

    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }

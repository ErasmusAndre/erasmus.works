<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Erasmus Works</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
      }
      img {
        width: min(80vw, 640px);
        height: auto;
      }
    </style>
  </head>
  <body>
    <img src="/logo.png" alt="Erasmus Works" />
  </body>
</html>

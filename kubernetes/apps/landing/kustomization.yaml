apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-landing
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: landing-content
    files:
      - index.html
      - logo.png
      - favicon.png
resources:
  - app.yaml
  - backendtrafficpolicy.yaml
  - httproute.yaml

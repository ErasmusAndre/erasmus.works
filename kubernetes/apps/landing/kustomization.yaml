apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-landing
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: landing-content
    files:
      - index.html
      - robots.txt
      - sitemap.xml
      - style.css
      - logos.css
      - logo.png
      - favicon.png
      - og.jpg
      - shot-immich.webp
      - shot-nextcloud.webp
      - shot-authentik.webp
      - shot-grafana.webp
      - shot-truenas.webp
      - shot-homepage.webp
      - shot-hass.webp
      - JetBrainsMono-Variable.woff2
      - IBMPlexSans-Regular.woff2
      - OFL.txt
resources:
  - app.yaml
  - backendtrafficpolicy.yaml
  - httproute.yaml

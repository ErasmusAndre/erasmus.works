apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: landing
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: homelab
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - erasmus.works
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # Without this nginx sends no Cache-Control, so Cloudflare falls back to
        # its own four-hour browser TTL and serves stale CSS against fresh HTML.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: "public, max-age=60, must-revalidate"
      backendRefs:
        - name: landing
          group: ""
          kind: Service
          port: 8080
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: landing-www
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: homelab
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - www.erasmus.works
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # Cloudflare terminates TLS and the tunnel hands Envoy plain HTTP, so the
        # scheme has to be set here or the Location header comes back as http://
        # and costs every visitor an extra redirect hop.
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: erasmus.works
            statusCode: 301

apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-nta-collector-nfs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Same dataset the NTA collector writes to, read-only here. Shown in Nextcloud as External storage.
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
  nfs:
    server: 192.168.20.40
    path: /mnt/tank/nta-collector
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nta-collector-data
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Ti
  storageClassName: ""
  volumeName: nextcloud-nta-collector-nfs

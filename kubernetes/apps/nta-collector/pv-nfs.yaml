apiVersion: v1
kind: PersistentVolume
metadata:
  name: nta-collector-nfs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Bookkeeping value only. The 1T quota on the TrueNAS dataset is the real limit.
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
  nfs:
    server: 192.168.20.40
    path: /mnt/tank/nta-collector
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nta-collector-data
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes:
    - ReadWriteMany
  # Keep this aligned with the PV bookkeeping value above if you change it.
  resources:
    requests:
      storage: 1Ti
  storageClassName: ""
  volumeName: nta-collector-nfs

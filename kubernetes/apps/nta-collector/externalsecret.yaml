apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nta-collector-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: nta-collector-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: NTA_KEY_TRIPS
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: nta-key-trips
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: NTA_KEY_VEHICLES
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: nta-key-vehicles
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: NTA_HEALTHCHECK_URL
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: nta-healthcheck-url
        metadataPolicy: None
        nullBytePolicy: Ignore

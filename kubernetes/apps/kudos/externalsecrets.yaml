apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kudos-postgres-auth
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: kudos-postgres-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/basic-auth
      data:
        username: kudos
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kudos-postgres-password
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kudos-app-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: kudos-app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        DATABASE_URL: postgresql://kudos:{{ .postgres_password | urlquery }}@kudos-postgres-rw.app-kudos.svc.cluster.local:5432/kudos
        AUTH_SECRET: "{{ .auth_secret }}"
        AUTH_SMTP_URL: smtp://erasmus.works:{{ .smtp_password | urlquery }}@mail-eu.smtp2go.com:587
        S3_ACCESS_KEY_ID: "GK4f9c40fffda94b6337b0a04d"
        S3_SECRET_ACCESS_KEY: "{{ .s3_secret_access_key }}"
        VAPID_PUBLIC_KEY: "{{ .vapid_public_key }}"
        VAPID_PRIVATE_KEY: "{{ .vapid_private_key }}"
  data:
    - secretKey: postgres_password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kudos-postgres-password
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: auth_secret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kudos-auth-secret
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: smtp_password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: smtp2go-password
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: s3_secret_access_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kudos-s3-secret-access-key
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: vapid_public_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kudos-vapid-public-key
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: vapid_private_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kudos-vapid-private-key
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1

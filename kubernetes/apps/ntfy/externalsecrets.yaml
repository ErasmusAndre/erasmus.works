apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-app-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ntfy-app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        auth-users: "andre:{{ .admin_password_hash }}:admin"
  data:
    - secretKey: admin_password_hash
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: ntfy-admin-password-hash
        metadataPolicy: None
        nullBytePolicy: Ignore

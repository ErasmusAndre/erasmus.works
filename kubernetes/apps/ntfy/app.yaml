apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  strategy:
    type: Recreate
    rollingUpdate: null
  replicas: 1
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.29.0
          args:
            - serve
          env:
            - name: NTFY_BASE_URL
              value: https://ntfy.erasmus.works
            - name: NTFY_LISTEN_HTTP
              value: ":8080"
            - name: NTFY_BEHIND_PROXY
              value: "true"
            - name: NTFY_CACHE_FILE
              value: /var/lib/ntfy/cache.db
            - name: NTFY_ATTACHMENT_CACHE_DIR
              value: /var/lib/ntfy/attachments
            - name: NTFY_AUTH_FILE
              value: /var/lib/ntfy/user.db
            - name: NTFY_AUTH_DEFAULT_ACCESS
              value: deny-all
            - name: NTFY_AUTH_USERS
              valueFrom:
                secretKeyRef:
                  name: ntfy-app-secrets
                  key: auth-users
            - name: NTFY_AUTH_ACCESS
              valueFrom:
                secretKeyRef:
                  name: ntfy-app-secrets
                  key: auth-access
            - name: NTFY_AUTH_TOKENS
              valueFrom:
                secretKeyRef:
                  name: ntfy-app-secrets
                  key: auth-tokens
            - name: NTFY_ENABLE_LOGIN
              value: "true"
            # Relays poll requests through ntfy.sh so the iOS app gets instant push
            - name: NTFY_UPSTREAM_BASE_URL
              value: https://ntfy.sh
            - name: TZ
              value: Europe/Amsterdam
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/ntfy
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-data
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: ntfy
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: homelab
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - ntfy.homelab
    - ntfy.erasmus.works
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ntfy
          group: ""
          kind: Service
          port: 8080
          weight: 1

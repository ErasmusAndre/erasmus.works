apiVersion: apps/v1
kind: Deployment
metadata:
  name: diabeteshub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diabeteshub
  template:
    metadata:
      labels:
        app: diabeteshub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.6-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: http
            # The page is only there once git-sync has cloned the repo.
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: git
              mountPath: /git
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # Pulls the site from its own public repo, so pushes to main go live
        # within a minute. Pin --ref to a tag or commit to review changes first.
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.7.1
          args:
            - --repo=https://github.com/lynette-erasmus1975/diabeteshub
            - --ref=main
            - --root=/git
            - --link=current
            - --period=60s
            - --max-failures=10
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: git
              mountPath: /git
            - name: git-sync-tmp
              mountPath: /tmp
      volumes:
        - name: git
          emptyDir:
            sizeLimit: 100Mi
        - name: nginx-conf
          configMap:
            name: diabeteshub-nginx
        - name: tmp
          emptyDir: {}
        - name: git-sync-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: diabeteshub
spec:
  selector:
    app: diabeteshub
  ports:
    - name: http
      port: 8080
      targetPort: http

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: diabeteshub
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: homelab
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - diabeteshub.erasmus.works
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # Keeps Cloudflare from holding an old copy for hours after a push.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: "public, max-age=60, must-revalidate"
      backendRefs:
        - name: diabeteshub
          group: ""
          kind: Service
          port: 8080
          weight: 1

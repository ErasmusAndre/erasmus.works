server {
    listen 8080;
    server_name _;

    # git-sync swaps /git/current to each new commit. Symlinks committed to the
    # repo itself are refused so they can't expose files elsewhere in the pod.
    root /git/current;
    disable_symlinks on from=$document_root;

    # Hides git-sync's .git file and any other dotfiles from the repo.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

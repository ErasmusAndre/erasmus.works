apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kudos-dev-app-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: kudos-dev-app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        AUTH_SECRET: "{{ .auth_secret }}"
        S3_ACCESS_KEY_ID: "GKf5b9923225454d614d32ec63"
        S3_SECRET_ACCESS_KEY: "{{ .s3_secret_access_key }}"
        VAPID_PUBLIC_KEY: "{{ .vapid_public_key }}"
        VAPID_PRIVATE_KEY: "{{ .vapid_private_key }}"
  data:
    - secretKey: auth_secret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kudos-dev-auth-secret
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: s3_secret_access_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kudos-dev-s3-secret-access-key
        metadataPolicy: None
        nullBytePolicy: Ignore
    # Shared with production: push keys aren't tied to an origin.
    - secretKey: vapid_public_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kudos-vapid-public-key
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: vapid_private_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kudos-vapid-private-key
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-edge-oidc
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: authentik-edge-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        client-secret: "{{ .client_secret }}"
  data:
    - secretKey: client_secret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: envoy-gateway-oauth2-client-secret
        metadataPolicy: None
        nullBytePolicy: Ignore
---
# The kudos image is private on GHCR. A GitHub classic token with only read:packages;
# renew it in Bitwarden before it expires or new pods can't pull the image.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "ErasmusAndre:%s" .token | b64enc }}"}}}'
  data:
    - secretKey: token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: ghcr-pull-token
        metadataPolicy: None
        nullBytePolicy: Ignore

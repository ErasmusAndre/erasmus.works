# Test copy of kudos (same image) with TEST_CLOCK on: /dev scenarios, one-tap logins and a
# movable clock. Only reachable through Authentik (securitypolicy.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kudos
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # The test clock and captured sign-in links live in process memory: keep one replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kudos
  template:
    metadata:
      labels:
        app: kudos
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.38
          command:
            - sh
            - -c
            - until nc -z kudos-dev-postgres-rw.app-kudos-dev.svc.cluster.local 5432; do sleep 2; done
        # Keep its tag equal to the app container's.
        - name: migrate
          image: ghcr.io/erasmusandre/kudos:sha-01e073c
          command:
            - npm
            - run
            - db:migrate
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kudos-dev-postgres-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: kudos
          image: ghcr.io/erasmusandre/kudos:sha-01e073c
          envFrom:
            - secretRef:
                name: kudos-dev-app-secrets
          env:
            - name: TEST_CLOCK
              value: "true"
            # Sample players in /dev scenarios (game master first).
            - name: SEED_PLAYER_NAMES
              value: André,Debby,Hennie,Rian,Jelte,Franna,Lynette,Oupa
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kudos-dev-postgres-app
                  key: uri
            - name: AUTH_URL
              value: https://kudos-dev.erasmus.works
            - name: AUTH_SMTP_URL
              value: smtp://mailpit:1025
            - name: AUTH_EMAIL_FROM
              value: Kudos Dev <kudos-dev@erasmus.works>
            - name: S3_ENDPOINT
              value: http://garage.garage.svc.cluster.local:3900
            - name: S3_PUBLIC_ENDPOINT
              value: https://s3.erasmus.works
            # Must equal s3_region in kubernetes/infra/garage/garage.toml.
            - name: S3_REGION
              value: us-east-1
            - name: S3_BUCKET
              value: kudos-dev
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: VAPID_SUBJECT
              value: mailto:no-reply@erasmus.works
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kudos
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: kudos
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kudos
  labels:
    security.erasmus.works/oidc: authentik-edge
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: homelab
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - kudos-dev.erasmus.works
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mail
      backendRefs:
        - name: mailpit
          group: ""
          kind: Service
          port: 8025
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        # Envoy's default 15s route timeout would cut the live-update stream.
        request: 0s
      backendRefs:
        - name: kudos
          group: ""
          kind: Service
          port: 3000
          weight: 1

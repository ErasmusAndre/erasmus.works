# Open WebUI is the pod a prompt injection would try to steer, so it may only reach
# what it needs: DNS, its Postgres, the laptop's llama-server, SearXNG and the Playwright
# browser in app-ai-web, and HTTPS to Cloudflare for the Authentik login. No other
# internet, cluster service, node or LAN host.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-webui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: open-webui
      app.kubernetes.io/name: open-webui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/name: envoy
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: ai-postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app-ai-web
          podSelector:
            matchLabels:
              app: searxng
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app-ai-web
          podSelector:
            matchLabels:
              app: playwright
      ports:
        - port: 3000
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 192.168.178.81/32
      ports:
        - port: 8080
          protocol: TCP
    # HTTPS only to Cloudflare (https://www.cloudflare.com/ips-v4, 2026-10-08): the Authentik
    # login (authentik.erasmus.works is proxied by Cloudflare). Nothing else is needed:
    # OFFLINE_MODE keeps Hugging Face out, pages go through Playwright. If Cloudflare adds a
    # range and logins break, update this list.
    - to:
        - ipBlock:
            cidr: 173.245.48.0/20
        - ipBlock:
            cidr: 103.21.244.0/22
        - ipBlock:
            cidr: 103.22.200.0/22
        - ipBlock:
            cidr: 103.31.4.0/22
        - ipBlock:
            cidr: 141.101.64.0/18
        - ipBlock:
            cidr: 108.162.192.0/18
        - ipBlock:
            cidr: 190.93.240.0/20
        - ipBlock:
            cidr: 188.114.96.0/20
        - ipBlock:
            cidr: 197.234.240.0/22
        - ipBlock:
            cidr: 198.41.128.0/17
        - ipBlock:
            cidr: 162.158.0.0/15
        - ipBlock:
            cidr: 104.16.0.0/13
        - ipBlock:
            cidr: 104.24.0.0/14
        - ipBlock:
            cidr: 172.64.0.0/13
        - ipBlock:
            cidr: 131.0.72.0/22
      ports:
        - port: 443
          protocol: TCP

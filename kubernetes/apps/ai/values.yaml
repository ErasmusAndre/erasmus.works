# Open WebUI: chat UI and agent loop for the private AI at ai.erasmus.works.
# The model runs on the laptop (see openaiBaseApiUrl); plan and safety design in local-ai/LOCAL-AI-PLAN.md.

# Subcharts off: no in-cluster model, and Pipelines would run arbitrary Python.
ollama:
  enabled: false
pipelines:
  enabled: false
tika:
  enabled: false

# Single replica, so the in-memory websocket manager is enough and no Redis is needed.
websocket:
  enabled: true
  manager: ""
  redis:
    enabled: false

workload:
  kind: Deployment
# After the PVC and Postgres (wave 1); otherwise Argo waits forever on a pod that can't schedule.
annotations:
  argocd.argoproj.io/sync-wave: "2"
replicaCount: 1
strategy:
  type: Recreate

serviceAccount:
  automountServiceAccountToken: false

nodeSelector:
  kubernetes.io/hostname: talos-node-2

persistence:
  enabled: true
  existingClaim: open-webui-data

resources:
  requests:
    cpu: 100m
    memory: 1Gi

enableOpenaiApi: true
# llama-server on the laptop (work-victus, Wi-Fi, fixed IP in UniFi), reachable from the
# Servers VLAN only through the UniFi policy Allow-Cluster-to-llama and the laptop's ufw.
# An IP rather than a selectorless Service: Argo CD excludes Endpoints/EndpointSlices.
openaiBaseApiUrl: http://192.168.178.81:8080/v1
openaiApiKeyExistingSecret: ai-app-secrets
openaiApiKeyExistingSecretKey: llama-api-key

sso:
  enabled: true
  # Creates the account on first Authentik login. New accounts start as "pending"
  # (DEFAULT_USER_ROLE below), except the very first one, which becomes admin.
  enableSignup: true
  oidc:
    enabled: true
    clientId: ai-erasmus-works
    clientExistingSecret: ai-app-secrets
    clientExistingSecretKey: oauth-client-secret
    providerUrl: https://authentik.erasmus.works/application/o/ai/.well-known/openid-configuration
    providerName: Authentik
    scopes: openid email profile

extraEnvVars:
  - name: WEBUI_URL
    value: https://ai.erasmus.works
  - name: CORS_ALLOW_ORIGIN
    value: https://ai.erasmus.works
  - name: WEBUI_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: ai-app-secrets
        key: webui-secret-key
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: ai-app-secrets
        key: database-url
  # Login only through Authentik.
  - name: ENABLE_SIGNUP
    value: "false"
  - name: ENABLE_LOGIN_FORM
    value: "false"
  - name: DEFAULT_USER_ROLE
    value: pending
  # No model connections besides the laptop, and nothing shared outward.
  - name: ENABLE_DIRECT_CONNECTIONS
    value: "false"
  - name: ENABLE_COMMUNITY_SHARING
    value: "false"
  - name: ENABLE_VERSION_UPDATE_CHECK
    value: "false"
  # Web search and page reading run in app-ai-web (SearXNG + Playwright), never in this pod.
  # Open WebUI keeps settings in its database after the first start, so these only seed a
  # fresh install; on the running one they were set in Admin > Settings > Web Search.
  - name: ENABLE_WEB_SEARCH
    value: "true"
  - name: WEB_SEARCH_ENGINE
    value: searxng
  - name: SEARXNG_QUERY_URL
    value: http://searxng.app-ai-web.svc.cluster.local:8080/search?q=<query>
  - name: WEB_SEARCH_RESULT_COUNT
    value: "5"
  - name: WEB_LOADER_ENGINE
    value: playwright
  - name: PLAYWRIGHT_WS_URL
    value: ws://playwright.app-ai-web.svc.cluster.local:3000
  # Document search embeddings, on CPU in this pod. Multilingual (Dutch, Afrikaans, ...).
  # OFFLINE_MODE stops Open WebUI from re-downloading the whole Hugging Face repo
  # (~4.5 GB of formats it never uses) on every start; it loads from the PVC cache.
  # To change models: set OFFLINE_MODE to false, pick the model in Admin > Documents,
  # delete the unused onnx/openvino/tf files, then set it back.
  - name: RAG_EMBEDDING_MODEL
    value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  - name: OFFLINE_MODE
    value: "true"
  # Code runs in the browser (Pyodide), never in the pod.
  - name: CODE_EXECUTION_ENGINE
    value: pyodide
  - name: CODE_INTERPRETER_ENGINE
    value: pyodide
  - name: ANONYMIZED_TELEMETRY
    value: "false"
  - name: DO_NOT_TRACK
    value: "true"
  - name: SCARF_NO_ANALYTICS
    value: "true"

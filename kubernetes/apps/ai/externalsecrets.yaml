apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-postgres-auth
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ai-postgres-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/basic-auth
      data:
        username: openwebui
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: ai-postgres-password
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-app-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ai-app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        database-url: postgresql://openwebui:{{ .password }}@ai-postgres-rw.app-ai.svc.cluster.local:5432/openwebui
        webui-secret-key: "{{ .webui_secret_key }}"
        oauth-client-secret: "{{ .oauth_client_secret }}"
        llama-api-key: "{{ .llama_api_key }}"
  data:
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: ai-postgres-password
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: webui_secret_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: ai-webui-secret-key
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: oauth_client_secret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: ai-oauth2-client-secret
        metadataPolicy: None
        nullBytePolicy: Ignore
    # Also in ~/.config/local-ai/api-key on the laptop; rotate both together.
    - secretKey: llama_api_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: llama-api-key
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-postgres-backup-s3
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ai-postgres-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        ACCESS_KEY_ID: "GKb09f8e1209e712a593c52e90"
        ACCESS_SECRET_KEY: "{{ .access_secret_key }}"
  data:
    - secretKey: access_secret_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: ai-cnpg-backup-secret-access-key
        metadataPolicy: None
        nullBytePolicy: Ignore

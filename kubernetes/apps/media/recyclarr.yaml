apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  # Upstream removed includes.json from config-templates (deleted in 9faf65f), so
  # `include:` finds nothing and every sync fails. The templates are now meant to be
  # copied locally and customised, so the settings below are inlined from
  # radarr/templates/hd-bluray-web.yml and sonarr/templates/web-1080p.yml.
  recyclarr.yml: |
    # yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json
    sonarr:
      sonarr:
        base_url: http://sonarr:8989
        api_key: !env_var SONARR_API_KEY
        delete_old_custom_formats: true
        quality_definition:
          type: series
        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
            reset_unmatched_scores:
              enabled: true
        custom_format_groups:
          add:
            - trash_id: 158188097a58d7687dee647e04af0da3 # [Optional] Golden Rule HD
            - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4 # [Optional] Language Profiles
            - trash_id: 85fae4a2294965b75710ef2989c850eb # [Streaming Services] HD/UHD boost
            - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats
    radarr:
      radarr:
        base_url: http://radarr:7878
        api_key: !env_var RADARR_API_KEY
        delete_old_custom_formats: true
        quality_definition:
          type: movie
        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
        custom_format_groups:
          add:
            - trash_id: f8bf8eab4617f12dfdbd16303d8da245 # [Optional] Golden Rule HD
            - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # [Unwanted] Unwanted Formats
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr-secret
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: recyclarr-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SONARR_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: sonarr-api-key
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: RADARR_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: radarr-api-key
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  schedule: "0 5 * * *" # Every day at 5:00 AM, after the VolSync backup window
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: recyclarr
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.7.1
              args:
                - sync
              env:
                - name: TZ
                  value: Europe/Amsterdam
              envFrom:
                - secretRef:
                    name: recyclarr-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: config-file
                  mountPath: /config/recyclarr.yml
                  subPath: recyclarr.yml
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              emptyDir: {}
            - name: config-file
              configMap:
                name: recyclarr-config
            - name: tmp
              emptyDir: {}
